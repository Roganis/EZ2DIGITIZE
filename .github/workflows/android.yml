name: Android app

# The capture companion (android/): lint, unit tests and a debug APK.
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest  # has the Android SDK (ANDROID_HOME)
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Lint, unit tests, debug APK
        run: ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ez2digitize-capture-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/reports/
          retention-days: 30
