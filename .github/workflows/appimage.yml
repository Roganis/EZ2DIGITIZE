# Build the EZ2DIGITIZE AppImage (Linux x86_64) with the pinned backends
# inside, and test it like a user would: the GUI starts, `check` finds the
# bundled tools, and a full pipeline run on the synthetic scene exports a GLB.
#
# The backends come from the newest Backends workflow run (this branch first,
# then main) that uploaded a Linux archive; Brush from its pinned release
# (keep in step with ez2digitize.backends.brush.PINNED_VERSION).
name: AppImage

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "tools/packaging/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/appimage.yml"
  push:
    branches: [main]

permissions:
  contents: read
  actions: read  # to download the backend archive from the Backends workflow

env:
  BRUSH_VERSION: v0.3.0

concurrency:
  group: appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appimage:
    # The AppImage needs the glibc it was built with or newer: build on the
    # oldest supported distro.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install build tools and Qt's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf file libegl1 libgl1 libxkbcommon0 \
            libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 libxcb-cursor0 libgfortran5

      - uses: astral-sh/setup-uv@v6

      - name: Get the backend archive
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          for branch in "$BRANCH" main; do
            for run in $(gh run list -R "$GITHUB_REPOSITORY" --workflow backends.yml \
                           --branch "$branch" --limit 20 --json databaseId -q '.[].databaseId'); do
              if gh run download "$run" -R "$GITHUB_REPOSITORY" -n backends-Linux -D artifact \
                 && ls artifact/backends/ez2d-backends-linux-x86_64.tar.gz; then
                echo "backends from Backends run $run ($branch)" | tee -a "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              rm -rf artifact
            done
          done
          echo "no Backends run with a Linux archive found" >&2
          exit 1

      - name: Get Brush
        run: |
          curl -sSLf -o brush.tar.xz \
            "https://github.com/ArthurBrussee/brush/releases/download/${BRUSH_VERSION}/brush-app-x86_64-unknown-linux-gnu.tar.xz"
          mkdir -p build/brush && tar xf brush.tar.xz -C build/brush --strip-components 1

      - name: Synthetic test scene
        run: uv run --group feasibility tools/feasibility/bench.py synth build/synthetic

      - name: Build and test the AppImage
        run: |
          uv run --group packaging python tools/packaging/build.py \
            --backends artifact/backends/ez2d-backends-linux-x86_64.tar.gz \
            --brush build/brush \
            --smoke build/synthetic/images

      - name: Summary
        if: always()
        run: |
          {
            echo '```json'
            cat build/appimage/report.json || true
            echo '```'
            echo -n 'Highest glibc symbol needed: '
            find build/appimage/dist -type f \( -name '*.so*' -o -perm -u+x \) -print0 \
              | xargs -0 -n 50 objdump -T 2>/dev/null | grep -o 'GLIBC_2\.[0-9]*' \
              | sort -t. -k2 -n -u | tail -1
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: EZ2DIGITIZE-AppImage
          retention-days: 14
          path: |
            build/appimage/*.AppImage
            build/appimage/report.json
