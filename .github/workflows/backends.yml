# Build pinned, CPU-only COLMAP and OpenMVS (tools/backends/build.sh) for
# Linux x86_64, macOS arm64 and Windows x64, check them with the benchmark
# harness (not on Windows) and the app's own backend modules on the synthetic
# scene, and upload the packages as artifacts. Off main, also time the
# Windows build against main's (the compare job).
name: Backends

on:
  workflow_dispatch:
  workflow_call:  # from the Release workflow: binaries built from the tagged commit
  pull_request:
    paths:
      - "tools/backends/**"
      - "tools/feasibility/plans/backends-smoke.toml"
      - ".github/workflows/backends.yml"
  push:
    branches: [main]
    paths:
      - "tools/backends/**"
      - ".github/workflows/backends.yml"

permissions:
  contents: read

# One build per branch at a time. A new push waits for the running build
# instead of cancelling it: most pushes don't touch the backends, and a
# cancelled multi-hour build loses its compile progress. Only the newest
# waiting run is kept, and it starts from the cache the first one saves.
concurrency:
  group: backends-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Linux: the oldest supported runner, because binaries need a glibc at
        # least as new as the build machine's.
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 350
    defaults:
      run:
        shell: bash  # Git Bash on Windows
    env:
      # A short work path on Windows: vcpkg build trees pass the 260-character
      # limit under the workspace. The cache stays in the workspace either way.
      EZ2D_BACKENDS_WORK: ${{ matrix.os == 'windows-latest' && 'C:/ez2d' || '' }}
      VCPKG_BINARY_CACHE: ${{ github.workspace }}/build/backends/vcpkg-cache
      PREFIX: ${{ matrix.os == 'windows-latest' && 'C:/ez2d/prefix' || 'build/backends/prefix' }}
      EXE: ${{ matrix.os == 'windows-latest' && '.exe' || '' }}
    steps:
      - name: Long paths in git (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - uses: actions/checkout@v5

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gfortran nasm autoconf autoconf-archive automake \
            libtool bison flex pkg-config zip unzip curl linux-libc-dev \
            libgl-dev libglew-dev  # only to satisfy COLMAP's configure checks

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        # glew: only to satisfy COLMAP's configure checks
        run: brew install ninja nasm autoconf autoconf-archive automake libtool pkg-config libomp glew

      # cl, link, dumpbin, and the CMake and Ninja that come with Visual Studio.
      # vcpkg fetches the rest (nasm, perl...) itself.
      - name: MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # vcpkg's binary cache. Saved even when the build fails, so a failure late
      # in a multi-hour build doesn't throw away the dependencies built so far,
      # but only when the build added packages to it: each entry is ~800 MB,
      # and new ones would push main's out of the repository's 10 GB. Caches
      # belong to their branch; a pull request also reads main's.
      - name: Restore vcpkg cache
        uses: actions/cache/restore@v4
        with:
          path: build/backends/vcpkg-cache
          key: backends-vcpkg-${{ runner.os }}-${{ github.run_id }}
          restore-keys: backends-vcpkg-${{ runner.os }}-

      - name: List the cached packages
        run: |
          mkdir -p build/backends/vcpkg-cache
          (cd build/backends/vcpkg-cache && find . -type f | sort) > "$RUNNER_TEMP/vcpkg-before.txt"
          echo "$(wc -l < "$RUNNER_TEMP/vcpkg-before.txt") packages restored"

      # Before the build, so the summary step can run even when the build fails.
      - uses: astral-sh/setup-uv@v6

      - name: Build
        run: tools/backends/build.sh

      - name: New packages to cache?
        id: new-packages
        if: always()
        run: |
          (cd build/backends/vcpkg-cache && find . -type f | sort) > "$RUNNER_TEMP/vcpkg-after.txt"
          added=$(comm -13 "$RUNNER_TEMP/vcpkg-before.txt" "$RUNNER_TEMP/vcpkg-after.txt" | wc -l)
          echo "$added packages built"
          echo "added=$added" >> "$GITHUB_OUTPUT"

      - name: Save vcpkg cache
        if: always() && steps.new-packages.outputs.added != '0'
        uses: actions/cache/save@v4
        with:
          path: build/backends/vcpkg-cache
          key: backends-vcpkg-${{ runner.os }}-${{ github.run_id }}

      # The harness is POSIX only (process groups, wait4); on Windows the app's
      # own pipeline test below is the check.
      - name: Smoke test with the benchmark harness
        if: runner.os != 'Windows'
        run: |
          B="uv run --group feasibility tools/feasibility/bench.py"
          $B synth ~/ez2d-data/synthetic
          $B run tools/feasibility/plans/backends-smoke.toml --results build/smoke \
            --machine "ci-${{ runner.os }}" \
            --colmap "$PREFIX/bin/colmap" --openmvs-dir "$PREFIX/bin"

      - name: App pipeline with the fresh builds
        env:
          EZ2D_REQUIRE_BACKENDS: "1"
          EZ2D_TEST_DOWNLOADS: "1"  # the learned features' models (49 MB)
        # The backend tests don't use Qt; without pytest-qt they also run on
        # runners without the libraries Qt needs (libEGL on Ubuntu).
        run: |
          export EZ2D_COLMAP="$PREFIX/bin/colmap$EXE" EZ2D_OPENMVS_DIR="$PREFIX/bin"
          uv run --all-groups pytest tests/backends -rs -p no:pytest-qt

      - name: Summary
        if: always()
        run: |
          # Always there, so the artifact's layout (backends/...) is the same
          # on every platform.
          mkdir -p build/smoke-report
          B="uv run --group feasibility tools/feasibility/bench.py"
          $B report --results build/smoke --out build/smoke-report || true
          cat "$PREFIX/BUILDINFO.json" >> "$GITHUB_STEP_SUMMARY" || true
          cat build/smoke-report/*.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backends-${{ runner.os }}
          # The Backend tests workflow and the app workflows reuse these
          # archives; the backends are rebuilt only when tools/backends changes.
          retention-days: 90
          path: |
            build/backends/ez2d-backends-*.tar.gz
            build/backends/BUILDINFO-*.json
            build/smoke-report/

  # Is the new build slower to use? Times the app's own pipeline (`ez2d run`)
  # with this run's Windows build and main's newest, on one runner, taking
  # turns (tools/backends/compare.py), and puts the per-stage table in the
  # summary. Windows only, where the compiler choice is open (MSVC or
  # clang-cl); not on main, where both builds would be the same.
  compare:
    needs: build
    if: ${{ !cancelled() && github.event_name != 'workflow_call' && github.ref != 'refs/heads/main' }}
    runs-on: windows-latest
    timeout-minutes: 150
    permissions:
      contents: read
      actions: read  # main's archive, from another run
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      - name: This run's build
        uses: actions/download-artifact@v4
        with:
          name: backends-Windows
          path: build/compare/branch-artifact

      - name: Main's newest build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for run in $(gh run list -R "$GITHUB_REPOSITORY" --workflow backends.yml \
                         --branch main --limit 20 --json databaseId -q '.[].databaseId'); do
            if gh run download "$run" -R "$GITHUB_REPOSITORY" -n backends-Windows \
                 -D build/compare/main-artifact \
               && ls build/compare/main-artifact/backends/ez2d-backends-windows-x86_64.tar.gz; then
              echo "main: Backends run $run" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            rm -rf build/compare/main-artifact
          done
          echo "no Windows build from main to compare with" >&2
          exit 1

      - name: Unpack both
        run: |
          for build in main branch; do
            archive=build/compare/$build-artifact/backends/ez2d-backends-windows-x86_64.tar.gz
            [ -e "$archive" ] || { echo "no $build archive (did its build fail?)" >&2; exit 1; }
            mkdir -p "build/compare/$build"
            tar -xzf "$archive" -C "build/compare/$build"
          done

      # 40 photos of 1600 × 1200: big enough that the backends' compute, not
      # process start-up, decides the times. Rendering takes about 10 minutes,
      # so the scene is kept until the renderer changes.
      - name: Benchmark scene (cache)
        id: scene
        uses: actions/cache@v4
        with:
          path: build/compare/scene
          key: compare-scene-${{ hashFiles('tools/feasibility/ez2d_bench/synthetic.py') }}

      - name: Render the benchmark scene
        if: steps.scene.outputs.cache-hit != 'true'
        run: |
          uv run --group feasibility tools/feasibility/bench.py synth build/compare/scene \
            --views-per-ring 20 --width 1600 --height 1200

      - name: Compare
        run: |
          # Windows paths (pwd -W in Git Bash), which Python reads.
          ROOT="$(pwd -W)/build/compare"
          uv run --all-groups python tools/backends/compare.py "$ROOT/scene/images" \
            --backend "main=$ROOT/main" --backend "branch=$ROOT/branch" --rounds 2 \
            --markdown "$ROOT/compare.md" --json "$ROOT/compare.json"

      - name: Summary
        if: always()
        run: cat build/compare/compare.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compare-Windows
          path: |
            build/compare/compare.md
            build/compare/compare.json
