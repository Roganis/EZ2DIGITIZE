# Make a release from a version tag (see docs/RELEASING.md): check that the
# tag matches the code's version and the changelog, run CI, build the
# backends from the tagged commit, build and test the three packages with
# them, pack the backends' exact source, and create a draft GitHub release
# with all of it, the app's source and SHA256SUMS. A maintainer reviews the
# draft and publishes it.
#
# Run by hand (Actions -> Release -> Run workflow) it's a dry run: the same
# builds from the chosen branch, the release's files listed in the summary,
# no release made.
#
# Hours on a cold vcpkg cache (the Backends workflow on main keeps it warm).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # to check the tag is on main

      - name: Version, tag and changelog
        id: version
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          python3 tools/packaging/release.py check ${TAG:+--tag "$TAG"} \
            --github-output "$GITHUB_OUTPUT"

      - name: The tag is on main
        if: github.ref_type == 'tag'
        run: |
          git fetch --quiet origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "tag ${GITHUB_REF_NAME} is not on main" >&2; exit 1; }

  ci:
    needs: check
    uses: ./.github/workflows/ci.yml

  backends:
    needs: check
    uses: ./.github/workflows/backends.yml

  sources:
    needs: check
    uses: ./.github/workflows/backend-sources.yml

  appimage:
    needs: backends
    uses: ./.github/workflows/appimage.yml
    with:
      backends-in-this-run: true

  macos:
    needs: backends
    uses: ./.github/workflows/macos-app.yml
    with:
      backends-in-this-run: true

  windows:
    needs: backends
    uses: ./.github/workflows/windows-app.yml
    with:
      backends-in-this-run: true

  publish:
    needs: [check, ci, sources, appimage, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to create the release
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: "{EZ2DIGITIZE-*,backend-sources-*}"
          path: downloaded

      - name: Gather the release's files
        run: |
          mkdir release
          find downloaded -type f \( -name "EZ2DIGITIZE-$VERSION-*" \
            -o -name 'ez2d-backends-source-*.tar' \) -exec mv {} release/ \;
          git archive --format=tar.gz --prefix="EZ2DIGITIZE-$VERSION/" \
            -o "release/EZ2DIGITIZE-$VERSION-source.tar.gz" HEAD
          # Everything a release promises (release.py notes), or no release.
          for name in "EZ2DIGITIZE-$VERSION-x86_64.AppImage" \
                      "EZ2DIGITIZE-$VERSION-macos-arm64.zip" \
                      "EZ2DIGITIZE-$VERSION-windows-x86_64.zip" \
                      "EZ2DIGITIZE-$VERSION-source.tar.gz" \
                      ez2d-backends-source-linux-x86_64.tar \
                      ez2d-backends-source-macos-arm64.tar \
                      ez2d-backends-source-windows-x86_64.tar; do
            test -s "release/$name" || { echo "missing: $name" >&2; exit 1; }
          done
          (cd release && sha256sum -- * > SHA256SUMS)
          python3 tools/packaging/release.py notes "$VERSION" > notes.md
          {
            echo "### EZ2DIGITIZE $VERSION"
            echo '```'
            ls -l release
            echo
            cat release/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          flags=(--draft --verify-tag --title "EZ2DIGITIZE $VERSION" --notes-file notes.md)
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" release/*
          echo "Draft release made: review it and publish it on the releases page." \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Dry run
        if: github.ref_type != 'tag'
        run: |
          echo "A dry run: no release made. The notes would be:" >> "$GITHUB_STEP_SUMMARY"
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
