# Build the EZ2DIGITIZE Windows app (x64, a portable zip) with the pinned
# backends inside, and test it like the AppImage: the GUI starts, `check`
# finds the bundled tools, and a full pipeline run on the synthetic scene
# exports a GLB.
#
# The backends come from the newest Backends workflow run (this branch first,
# then main), or for a release from the Release run itself, that uploaded a Windows archive; Brush from its pinned release
# (keep in step with ez2digitize.backends.brush.PINNED_VERSION). The app is
# not code-signed yet: see tools/packaging/README.md.
name: Windows app

on:
  workflow_dispatch:
  # From the Release workflow, which builds the backends in the same run.
  workflow_call:
    inputs:
      backends-in-this-run:
        type: boolean
        default: false
  pull_request:
    paths:
      - "src/**"
      - "tools/packaging/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/windows-app.yml"
  push:
    branches: [main]

permissions:
  contents: read
  actions: read  # to download the backend archive from the Backends workflow

env:
  BRUSH_VERSION: v0.3.0

concurrency:
  group: windows-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash  # Git Bash
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      - name: Get the backend archive (built in this run)
        if: inputs.backends-in-this-run
        uses: actions/download-artifact@v4
        with:
          name: backends-Windows
          path: artifact

      - name: Get the backend archive
        if: ${{ !inputs.backends-in-this-run }}
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          for branch in "$BRANCH" main; do
            for run in $(gh run list -R "$GITHUB_REPOSITORY" --workflow backends.yml \
                           --branch "$branch" --limit 20 --json databaseId -q '.[].databaseId'); do
              if gh run download "$run" -R "$GITHUB_REPOSITORY" -n backends-Windows -D artifact \
                 && ls artifact/backends/ez2d-backends-windows-x86_64.tar.gz; then
                echo "backends from Backends run $run ($branch)" | tee -a "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              rm -rf artifact
            done
          done
          echo "no Backends run with a Windows archive found" >&2
          exit 1

      - name: Get Brush
        run: |
          curl -sSLf -o brush.zip \
            "https://github.com/ArthurBrussee/brush/releases/download/${BRUSH_VERSION}/brush-app-x86_64-pc-windows-msvc.zip"
          mkdir -p build/brush && unzip -q brush.zip -d build/brush

      # Only the scene renderer: the rest of the benchmark harness is POSIX only.
      - name: Synthetic test scene
        env:
          PYTHONPATH: tools/feasibility
        run: uv run python -c "from pathlib import Path; from ez2d_bench import synthetic; print(synthetic.generate(Path('build/synthetic')), 'images')"

      - name: Build and test the app
        run: |
          uv run --group packaging python tools/packaging/build_windows.py \
            --backends artifact/backends/ez2d-backends-windows-x86_64.tar.gz \
            --brush build/brush \
            --smoke build/synthetic/images

      - name: Summary
        if: always()
        run: |
          {
            echo '```json'
            cat build/windows/report.json || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: EZ2DIGITIZE-Windows
          retention-days: 14
          path: |
            build/windows/*.zip
            build/windows/report.json
