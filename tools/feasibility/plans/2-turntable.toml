# Dataset 2: the same object on a turntable, static camera. Plain COLMAP is
# expected to lock onto the static background (few registered images or a
# wrong "camera did not move" solution); masks should fix it.
# Answers: is masking required for v1?

[dataset]
name = "turntable"
images = "~/ez2d-data/turntable/images"
masks = "~/ez2d-data/turntable/masks"

[[colmap]]
label = "sift3200"
max_image_size = 3200

[[colmap]]
label = "sift3200-masked"
max_image_size = 3200
masks = true

[[openmvs]]
label = "lvl1-masked"
source = "sift3200-masked"
resolution_level = 1
masks = true

[[brush]]
label = "brush-default"
source = "sift3200-masked"
args = ["--export-every", "30000", "--eval-split-every", "8", "--eval-save-to-disk"]
